<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품소개:제품검색</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://kit.fontawesome.com/55bf881097.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/sub2_common.css">
    <link rel="stylesheet" href="./css/sub2_4.css">
    <link rel="stylesheet" href="../css/aos.css">
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>
    <div id="wrap">
        <header id="headerArea">
            
        </header>
        
        <div class="visual">
            <img src="../sub2/images/common/sub_visual.png" alt="">
            <strong>제품소개</strong>
        </div>
        <div class="sub_nav">
            <ul>
                <li><a href="./sub2_1.html">합성고무</a></li>
                <li><a href="./sub2_2.html">합성수지</a></li>
                <li><a href="./sub2_3.html">나노탄소</a></li>
                <li><a class="active" href="./sub2_4.html">제품검색</a></li>
            </ul>
        </div>

        <!-- 전체검색팝업 -->
        <div class="search_modal">

        </div>
        
        <main id="content">
            <article>
                <div class="title_area">
                    <div class="line_map">
                        HOME &gt; 제품소개 &gt; <strong>제품검색</strong> 
                    </div>
                    <h2>제품검색<span>Innovative Materials</span></h2>
                    <p>한계를 넘어서는 혁신 소재로 더 나은 미래를 완성합니다.</p>
                </div>
                <div class="content_area">
                    <div class="serch_box" data-aos="fade-down" data-aos-duration="1000" data-aos-delay="200">
                        <label for="title">제품명</label>
                        <input id="title" type="text" placeholder="제품명, 제품 코드(SBR, ABS, CNT 등), 또는 키워드를 입력하세요" />
                        <button id="btn" type="button">검색</button>
                        <div class="serch_box_bottom">
                            <span>총 카테고리&colon;</span>
                            <ul>
                                <li class="active ">전체 &lpar;모두보기&rpar;</li>
                                <li>합성고무</li>
                                <li>합성수지</li>
                                <li>나노탄소</li>
                            </ul>
                        </div>
                    </div>

                    <div class="product_list" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">

                    </div>

                    <div class="modal_box">
                        <div class="popup">
                            <div class="pop_con">
                                <!-- 팝업 내용 -->
                            </div>
                            <a href="#" class="close_pop">close</a>
                        </div>
                    </div>
                </div>
            </article>
        </main>

        <footer id="footerArea">
            
        </footer>
    </div>

    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script src="./js/data_json.js"></script>
    <script src="../js/aos.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            //function(){} -> main_header.html의 로드가 완료가 되면...
            $.getScript('../js/fullnav.js');  //스크립트 js파일을 동작시키는 메소드
        });

        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        });
        $('.search_modal').load('../common/search_pop.html');
    </script>
    <script>
        AOS.init({
        easing: 'ease-in-out-sine'
        });
    </script>
</body>
</html>
